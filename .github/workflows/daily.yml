name: 秋招雷达日报

on:
  # 修改筛选配置、程序或本工作流后，自动运行一次以验证设置
  push:
    branches: [main]
    paths:
      - 'config.py'
      - 'main.py'
      - 'report.py'
      - 'store.py'
      - 'push.py'
      - 'tracker.py'
      - 'scrapers/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    # 每天北京时间 09:00 运行（UTC 01:00）
    # GitHub cron 可能有几分钟延迟，属正常现象
    - cron: '0 1 * * *'
  workflow_dispatch:  # 支持手动触发，方便随时跑一次

permissions:
  contents: write  # 需要写权限来 commit 简报和数据库

# 串行更新数据库，避免手动运行和定时任务同时保存数据
concurrency:
  group: campus-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai   # 设置时区为北京时间，简化日期计算
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 排队后读取分支最新数据，避免使用旧数据库
          ref: ${{ github.ref_name }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行抓取
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
        run: |
          # 首次运行（无数据库）用 --full 初始化，后续日常对比
          if [ -f data/jobs.db ]; then
            python main.py
          else
            python main.py --full
          fi

      - name: 导出投递追踪表
        if: always()
        run: |
          python tracker.py export || true

      - name: 写入 Actions 运行摘要
        if: always()
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -f "reports/${TODAY}.md" ]; then
            cat "reports/${TODAY}.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "今日简报未生成，请检查运行日志" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 提交简报与数据库
        if: always()
        run: |
          git config user.name "campus-radar-bot"
          git config user.email "bot@campus-radar.local"
          git add reports/ data/jobs.db || true
          if git diff --staged --quiet; then
            echo "今日无变化，无需提交"
          else
            git commit -m "📰 秋招雷达日报 $(date +%Y-%m-%d)"
            git push
          fi
